# Единственная конфигурация Alembic для проекта.
# Каталог миграций лежит рядом с этим файлом (migrations/), поэтому пути самонастрачиваются:
# %(here)s — каталог этого файла, %(here)s/.. — корень репозитория.
#
# sqlalchemy.url намеренно пуст: реальная строка подключения подставляется в env.py из
# Settings (ENV DATABASE_URL / POSTGRES_*), чтобы учётные данные не существовали в двух местах.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
