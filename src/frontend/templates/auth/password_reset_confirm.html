{% extends "base.html" %} {% block title %}Новый пароль — Anime Epic Moments{%
endblock %} {% block head %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/auth.css') }}"
/>
{% endblock %} {% block content %}
<div class="auth-page">
  <div class="auth-card glass">
    <div class="auth-logo">AEM</div>
    <p class="auth-sub">Придумайте новый пароль для вашего аккаунта.</p>

    <form
      class="auth-form"
      method="post"
      action="{{ url_for('auth.confirm_password_reset') }}"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="token" value="{{ token }}" />

      <div class="form-group">
        <label for="password">Новый пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="минимум 8 символов"
          required
          minlength="8"
          maxlength="128"
          autocomplete="new-password"
        />
        <div class="password-strength">
          <span class="pw-bar"></span><span class="pw-bar"></span>
          <span class="pw-bar"></span><span class="pw-bar"></span>
          <span class="pw-label"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="password_repeat">Повторите пароль</label>
        <input
          type="password"
          id="password_repeat"
          name="password_repeat"
          placeholder="ещё раз"
          required
          minlength="8"
          autocomplete="new-password"
        />
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-lg">
          Сохранить пароль
        </button>
      </div>
    </form>

    <div class="auth-links auth-links-center" style="justify-content: center">
      <a href="{{ url_for('auth.login_page') }}">← Вернуться ко входу</a>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/password_strength.js') }}"></script>
{% endblock %}
