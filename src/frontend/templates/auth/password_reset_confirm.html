<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Новый пароль - AEM</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Новый пароль</h1>
        <form
          class="auth-form"
          action="{{ url_for('auth.confirm_password_reset') }}"
          method="POST"
        >
          <input type="hidden" name="token" value="{{ token }}" />
          <div class="form-group">
            <label for="password">Новый пароль</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Минимум 8 символов"
              required
              minlength="8"
            />
          </div>
          <div class="form-group">
            <label for="password_repeat">Повторите пароль</label>
            <input
              type="password"
              id="password_repeat"
              name="password_repeat"
              placeholder="Повторите новый пароль"
              required
              minlength="8"
            />
          </div>
          <button type="submit" class="btn neon-pink btn-large">
            Сохранить пароль
          </button>
        </form>
        <p class="auth-switch">
          <a href="{{ url_for('auth.login_page') }}">Вернуться ко входу</a>
        </p>
      </div>
    </div>
    {% with messages = get_flashed_messages() %} {% if messages %}
    <div id="errorModal" class="modal">
      <div class="modal-content">
        <button type="button" class="close" onclick="closeErrorModal()">
          &times;
        </button>
        <h2 class="modal-title">Уведомление</h2>
        <ul class="modal-error-list">
          {% for message in messages %}
          <li>{{ message }}</li>
          {% endfor %}
        </ul>
        <div class="modal-actions">
          <button type="button" class="btn-modal" onclick="closeErrorModal()">
            Понятно
          </button>
        </div>
      </div>
    </div>
    <script>
      function openErrorModal() {
        const modal = document.getElementById("errorModal");
        if (!modal) return;
        modal.style.display = "flex";
      }

      function closeErrorModal() {
        const modal = document.getElementById("errorModal");
        if (!modal) return;
        modal.style.display = "none";
      }

      openErrorModal();
    </script>
    {% endif %} {% endwith %}
      <script src="{{ url_for('static', filename='js/theme_switcher.js') }}"></script>
  </body>
</html>
