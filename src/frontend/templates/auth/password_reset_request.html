{% extends "base.html" %}

{% block title %}Сброс пароля — Anime Epic Moments{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card glass">
    <div class="auth-logo">AEM</div>
    <p class="auth-sub">Укажите email — мы отправим ссылку для сброса пароля.</p>

    <form class="auth-form" method="post" action="{{ url_for('auth.request_password_reset') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com"
               required autofocus autocomplete="email">
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-primary btn-lg">Отправить ссылку</button>
      </div>
    </form>

    <div class="auth-links auth-links-center" style="justify-content:center">
      <a href="{{ url_for('auth.login_page') }}">← Вернуться ко входу</a>
    </div>
  </div>
</div>
{% endblock %}
