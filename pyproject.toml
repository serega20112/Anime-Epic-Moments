[project]
name = "anime-epic-moments"
version = "0.1.0"
description = "Anime Epic Moments — каталог аниме с поиском по описанию, просмотром и персональными рекомендациями"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite==0.21.0",
    "alembic==1.18.4",
    "asyncpg==0.30.0",
    "bcrypt==4.1.2",
    "curl-cffi==0.16.2",
    "dishka==1.10.1",
    "fastapi==0.116.1",
    "greenlet==3.5.4",
    "gunicorn==23.0.0",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "Jinja2==3.1.6",
    "psycopg==3.2.9",
    "psycopg-binary==3.2.9",
    "PyJWT==2.8.0",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "python-json-logger==3.2.1",
    "python-multipart==0.0.20",
    "redis==5.0.8",
    "requests==2.32.3",
    "SQLAlchemy==2.0.36",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.24.0,<2",
    "pytest-cov>=5.0.0,<8",
    "ruff>=0.6.0,<1",
]
lint = [
    "grimp==3.15",
    "import-linter==2.13",
]

[tool.uv]
default-groups = ["dev", "lint"]
required-version = ">=0.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

[tool.pytest.ini_options.markers]
unit = "pure logic tests without external IO (domain, use cases with mocks)"
integration = "tests exercising real components (DB, routers, repository + session)"
e2e = "full application flows through HTTP"

[tool.importlinter]
root_package = "backend"

[[tool.importlinter.contracts]]
name = "Layer Boundaries"
type = "layers"
containers = ["backend"]
layers = ["presentation", "infrastructure", "application", "domain"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false